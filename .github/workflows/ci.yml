name: CI (Unit, Integration & Visual Preservation Tests)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (No heavy LLM/BabelDOC asset downloads in CI)
        run: uv sync --extra dev

      - name: Generate synthetic test PDFs
        env:
          PYTHONIOENCODING: utf-8
        run: uv run python scripts/generate_test_pdfs.py

      - name: Run Unit, Integration, and Visual Preservation Tests
        run: uv run pytest
