[project]
name = "paperbridge-local"
version = "0.1.0"
description = "Windows local academic PDF translation app prioritizing formula and layout preservation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "pymupdf>=1.26.7,<2.0.0",
    "reportlab>=4.2.0",
    "pillow>=11.0.0",
    "numpy>=2.0.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
babeldoc = [
    "babeldoc==0.6.4",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v -rs --tb=short"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Offline unit tests (no real LLM or GPU required)",
    "integration: Offline integration tests using mock or local fixtures",
    "fault_injection: Fault injection and abnormal response handling tests",
    "visual: Visual pixel and layout preservation tests on synthetic PDFs",
    "real_llm: Real llama.cpp + PLaMo 3 Translate integration tests (opt-in via --run-real-llm or -m real_llm)",
    "gpu: Vulkan GPU offload and hardware verification tests (opt-in via --run-real-llm or -m gpu)",
]
